  </defs>
  <rect width="900" height="220" rx="22" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="22" font-weight="700">DIGITAL FORENSIC WORKFLOW</text>

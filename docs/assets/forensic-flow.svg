    <rect x="35" y="78" width="160" height="82" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/><text x="115" y="112" fill="#7dd3fc">01</text><text x="115" y="135" fill="white">Case Intake</text>
    <rect x="260" y="78" width="160" height="82" rx="14" fill="#111827" stroke="#a78bfa" stroke-width="2"/><text x="340" y="112" fill="#c4b5fd">02</text><text x="340" y="135" fill="white">Evidence</text>

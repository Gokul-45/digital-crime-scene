spring.application.name=digital-crime-scene
server.port=${PORT:8080}

# Demo database: explicit schema.sql + data.sql startup initialization.
spring.datasource.url=jdbc:h2:mem:crimedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always

jwt.secret.key=${JWT_SECRET_KEY:change-this-local-secret-key}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

app.ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

logging.level.com.crimescene=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

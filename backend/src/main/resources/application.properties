# =============================================================
# Digital Crime Scene Reconstruction System
# Spring Boot Application Properties
# =============================================================

spring.application.name=digital-crime-scene

server.port=8080

# =============================================================
# H2 IN-MEMORY DATABASE (Default - no installation needed)
# =============================================================
spring.datasource.url=jdbc:h2:mem:crimedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================
# POSTGRESQL (Uncomment to use PostgreSQL instead of H2)
# =============================================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/crime_scene_db
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=postgres
#spring.datasource.password=yourpassword

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =============================================================
# JWT CONFIGURATION
# =============================================================
jwt.secret.key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
jwt.expiration.ms=86400000

# =============================================================
# FILE UPLOAD
# =============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.file.upload-dir=./uploads

# =============================================================
# LOGGING
# =============================================================
logging.level.com.crimescene=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================================
# AI MICROSERVICE URL
# =============================================================
app.ai.service.url=http://localhost:5000

# =============================================================
# CORS
# =============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://digital-crime-scene-p3b8xsd65-gokul45.vercel.app
